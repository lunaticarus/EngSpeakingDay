<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>English Speaking Day</title>
  <script src="https://unpkg.com/html5-qrcode"></script>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700;800&display=swap');

    :root {
      --dp-color-ground: #f5f4ee;
      --dp-color-ink: #000000;
      --dp-color-accent: #ff0000;
      --dp-color-field: #0000ff;
      --dp-color-field-support: #facc15;
      --dp-typography-face: "Space Grotesk", sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      background-color: var(--dp-color-ground);
      color: var(--dp-color-ink);
      font-family: var(--dp-typography-face);
      line-height: 1.4;
      -webkit-text-size-adjust: 100%;
    }

    /* Landing Screen Overlay */
    #landingOverlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: var(--dp-color-ground);
      border: 4px solid var(--dp-color-ink);
      z-index: 10000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      padding: 24px;
      text-align: center;
    }

    .landing-box {
      background: #ffffff;
      border: 4px solid var(--dp-color-ink);
      box-shadow: 8px 8px 0px var(--dp-color-ink);
      padding: 32px 24px;
      max-width: 420px;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }

    .loader-bar {
      width: 100%;
      height: 12px;
      border: 2px solid var(--dp-color-ink);
      background: var(--dp-color-ground);
      overflow: hidden;
    }

    .loader-progress {
      width: 40%;
      height: 100%;
      background: var(--dp-color-field);
      animation: loading 1.2s infinite ease-in-out;
    }

    @keyframes loading {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(250%); }
    }

    .btn-guest {
      background: var(--dp-color-ground);
      color: var(--dp-color-ink);
      border: 3px solid var(--dp-color-ink);
      padding: 8px 16px;
      font-weight: 800;
      font-size: 0.85rem;
      text-transform: uppercase;
      cursor: pointer;
      box-shadow: 3px 3px 0px var(--dp-color-ink);
      width: 100%;
    }
    .btn-guest:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0px var(--dp-color-ink); }

    /* Main Container */
    .container { 
      display: flex; 
      flex-direction: column; 
      min-height: 100vh; 
      border: 3px solid var(--dp-color-ink); 
      visibility: hidden;
    }
    @media (min-width: 900px) { .container { flex-direction: row; } }

    .plane-main { flex: 1 1 60%; padding: clamp(12px, 3vw, 36px); border-bottom: 3px solid var(--dp-color-ink); }
    @media (min-width: 900px) { .plane-main { border-bottom: none; border-right: 3px solid var(--dp-color-ink); } }

    .plane-action { flex: 1 1 40%; background-color: var(--dp-color-accent); padding: clamp(12px, 3vw, 36px); display: flex; flex-direction: column; gap: 16px; }

    h1 { font-size: clamp(1.6rem, 4vw, 2.6rem); font-weight: 800; line-height: 1.1; text-transform: uppercase; letter-spacing: -0.02em; }
    h2 { font-size: clamp(1.1rem, 2.5vw, 1.4rem); font-weight: 800; text-transform: uppercase; background: var(--dp-color-field-support); display: inline-block; padding: 3px 8px; border: 3px solid var(--dp-color-ink); margin-bottom: 0.8rem; }
    h3 { font-size: 1rem; font-weight: 800; text-transform: uppercase; }

    .header-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; flex-wrap: wrap; gap: 8px; }
    .user-badge { background: var(--dp-color-ink); color: var(--dp-color-ground); padding: 4px 10px; font-size: 0.8rem; font-weight: 700; border: 2px solid var(--dp-color-ink); }

    .grand-banner { background: var(--dp-color-ink); color: var(--dp-color-ground); padding: 12px 16px; border: 3px solid var(--dp-color-ink); margin: 12px 0; display: flex; justify-content: space-between; align-items: center; }
    .grand-number { font-size: clamp(1.8rem, 4vw, 2.4rem); font-weight: 800; color: var(--dp-color-field-support); line-height: 1; }

    .grid-rules { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); border: 3px solid var(--dp-color-ink); background: var(--dp-color-ink); gap: 0; }
    .grid-cell { background: var(--dp-color-ground); padding: 12px; border: 1.5px solid var(--dp-color-ink); }

    .stat-row { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid var(--dp-color-ink); padding: 6px 4px; font-size: 0.9rem; font-weight: 600; }
    .podium-1 { background: #facc15; font-size: 0.95rem; font-weight: 800; border: 2px solid var(--dp-color-ink); margin-bottom: 3px; }
    .podium-2 { background: #e2e8f0; font-weight: 700; border: 2px solid var(--dp-color-ink); margin-bottom: 3px; }
    .podium-3 { background: #fdba74; font-weight: 700; border: 2px solid var(--dp-color-ink); margin-bottom: 3px; }

    .house-bar-container { width: 100%; border: 2px solid var(--dp-color-ink); height: 20px; margin-top: 4px; background: var(--dp-color-ground); }
    .house-bar { height: 100%; transition: width 0.5s ease; }
    .bg-Red { background-color: #ef4444; } .bg-Purple { background-color: #a855f7; } .bg-Yellow { background-color: #facc15; } .bg-Green { background-color: #10b981; }

    .scanner-wrapper { 
      position: relative; 
      width: 100%; 
      max-width: 400px; 
      margin: 0 auto; 
      border: 3px solid var(--dp-color-ink); 
      background: var(--dp-color-ink); 
      overflow: hidden; 
      display: none; 
    }
    .scanner-wrapper.active { display: block; }

    #reader { width: 100% !important; border: none !important; background: var(--dp-color-ink) !important; }
    #reader__scan_region { background: var(--dp-color-ink) !important; }
    #reader video { width: 100% !important; height: 220px !important; object-fit: cover !important; display: block !important; }
    #reader__dashboard, #reader__dashboard_section_csr, #reader__dashboard_section_swaplink, #reader__status_span, #reader img { display: none !important; }

    .action-btn-mobile { background: var(--dp-color-ground); color: var(--dp-color-ink); border: 3px solid var(--dp-color-ink); padding: 12px; width: 100%; font-weight: 800; font-size: 1rem; text-transform: uppercase; cursor: pointer; box-shadow: 4px 4px 0px var(--dp-color-ink); transition: all 0.1s; margin: 8px 0; }
    .action-btn-mobile:active { box-shadow: 0px 0px 0px var(--dp-color-ink); transform: translate(4px, 4px); }

    .input-rect { background: var(--dp-color-field); color: #fff; border: 3px solid var(--dp-color-ink); padding: 10px 12px; font-size: 1rem; font-weight: 700; width: 100%; outline: none; }
    .input-rect::placeholder { color: rgba(255,255,255,0.7); }

    .controls-row { display: flex; flex-direction: column; gap: 8px; margin-bottom: 12px; }
    select { padding: 6px 10px; border: 2.5px solid var(--dp-color-ink); font-weight: 700; font-size: 0.85rem; background: #ffffff; width: 100%; max-width: 260px; }
    
    .date-row { display: flex; gap: 8px; flex-wrap: wrap; width: 100%; }

    .date-field-group { display: flex; align-items: center; border: 2.5px solid var(--dp-color-ink); background: #ffffff; padding: 2px 6px; gap: 6px; flex: 1; min-width: 140px; }
    .date-field-group label { font-size: 0.75rem; font-weight: 800; text-transform: uppercase; color: var(--dp-color-ink); }
    .date-field-group input[type="date"] { border: none; background: transparent; font-weight: 600; font-size: 0.85rem; outline: none; width: 100%; cursor: pointer; }
    .btn-square { background: var(--dp-color-field); color: white; border: 2.5px solid var(--dp-color-ink); padding: 6px 12px; cursor: pointer; font-weight: 700; font-size: 0.85rem; }

    .lookup-container { background: var(--dp-color-ground); padding: 12px; border: 3px solid var(--dp-color-ink); margin-top: 8px; }

    /* Unified Bauhaus Modal */
    .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.7); display: none; align-items: center; justify-content: center; z-index: 9999; padding: 16px; }
    .modal-card { background: var(--dp-color-ground); border: 4px solid var(--dp-color-ink); box-shadow: 8px 8px 0px var(--dp-color-ink); padding: 20px; width: 100%; max-width: 380px; display: flex; flex-direction: column; gap: 12px; }
    
    .modal-title { background: var(--dp-color-field-support); border: 3px solid var(--dp-color-ink); padding: 4px 8px; font-weight: 800; font-size: 1.2rem; text-transform: uppercase; color: var(--dp-color-ink); }
    .modal-title.error { background: #ef4444; color: white; }
    .modal-title.success { background: #10b981; color: white; }

    .modal-info-row { display: flex; justify-content: space-between; font-weight: 700; border-bottom: 2px dashed var(--dp-color-ink); padding: 4px 0; }
    .modal-actions { display: flex; gap: 10px; margin-top: 8px; }
    
    .btn-confirm { flex: 1; background: #10b981; color: white; border: 3px solid var(--dp-color-ink); padding: 10px; font-weight: 800; cursor: pointer; box-shadow: 4px 4px 0px var(--dp-color-ink); }
    .btn-confirm:active { transform: translate(2px, 2px); box-shadow: 2px 2px 0px var(--dp-color-ink); }
    .btn-cancel { flex: 1; background: var(--dp-color-accent); color: white; border: 3px solid var(--dp-color-ink); padding: 10px; font-weight: 800; cursor: pointer; box-shadow: 4px 4px 0px var(--dp-color-ink); }
    .btn-cancel:active { transform: translate(2px, 2px); box-shadow: 2px 2px 0px var(--dp-color-ink); }
  </style>
</head>
<body>

<!-- Hidden Google Credential Listener -->
<div id="g_id_onload" data-client_id="99161504548-ujm0nvlq3mdf70dcq6qd7o9dmj2av54m.apps.googleusercontent.com" data-callback="handleCredentialResponse" data-auto_prompt="false"></div>

<!-- LANDING OVERLAY -->
<div id="landingOverlay">
  <div class="landing-box">
    <h1 style="font-size:1.8rem;">English<br>Speaking<br>Day</h1>
    <p style="font-weight:700; font-size:0.85rem; text-transform:uppercase;" id="landingStatus">Sign in with Teacher Account</p>
    
    <div id="authWrapper" style="display:inline-block; margin: 4px 0;">
      <div class="g_id_signin" id="googleSignInBtn" data-type="standard" data-size="large" data-theme="outline"></div>
    </div>

    <button class="btn-guest" onclick="proceedAsGuest()">View Leaderboard (Public)</button>
    <div class="loader-bar" id="landingLoader" style="display:none;"><div class="loader-progress"></div></div>
  </div>
</div>

<div class="container" id="mainContainer">
  <div class="plane-main">
    <div class="header-bar">
      <h1>🌟English Speaking Day🌟</h1>
      <div style="display:flex; align-items:center; gap:8px;">
        <button id="logoutBtn" class="btn-square" style="display:none; padding:4px 8px; font-size:0.75rem; background:#ef4444;" onclick="logout()">Logout</button>
        <div class="user-badge" id="userBadge">Public Mode</div>
      </div>
    </div>

    <div class="grand-banner">
      <div>
        <div style="font-size:0.75rem; font-weight:700; text-transform:uppercase;">Total Interactions</div>
        <div style="font-size:0.7rem; opacity:0.8;">Campus Conversations</div>
      </div>
      <div id="grandTotal" class="grand-number">0</div>
    </div>
    
    <div class="controls-row">
      <select id="presetRange" onchange="applyPreset()">
        <option value="all">All-Time Standing</option>
        <option value="today">Today's Live</option>
        <option value="thisWeek">This Week</option>
      </select>

      <div class="date-row">
        <div class="date-field-group">
          <label for="startDate">From:</label>
          <input type="date" id="startDate" onchange="refreshLeaderboard()">
        </div>
        <div class="date-field-group">
          <label for="endDate">To:</label>
          <input type="date" id="endDate" onchange="refreshLeaderboard()">
        </div>
      </div>
    </div>

    <div class="grid-rules">
      <div class="grid-cell">
        <h2>Star Student Speakers</h2>
        <div id="studentList">Loading...</div>
      </div>
      <div class="grid-cell">
        <h2>House Ranking</h2>
        <div id="houseList">Loading...</div>
        <h2 style="margin-top:1.2rem;">Top English Groups</h2>
        <div id="groupList">Loading...</div>
        <h2 style="margin-top:1.2rem;">Outstanding Classes</h2>
        <div id="classList">Loading...</div>
      </div>
    </div>
  </div>

  <div class="plane-action" id="teacherPanel" style="display:none;">
    <h2 style="background:var(--dp-color-ground); color:var(--dp-color-ink);">Teacher Terminal</h2>
    
    <div class="scanner-wrapper" id="scannerWrapper">
      <div id="reader"></div>
    </div>
    <button class="action-btn-mobile" id="scanBtn" onclick="toggleScanner()">START SCANNER</button>
    
    <div>
      <input type="text" id="manualId" class="input-rect" placeholder="Manual Student ID Entry" onkeypress="if(event.key==='Enter') submitManual()">
    </div>

    <div class="lookup-container">
      <h3>Class & Group Lookup</h3>
      <div style="display:flex; gap:6px; margin-top:6px; flex-wrap:wrap;">
        <select id="lookupType" style="flex:1;">
          <option value="class">Class</option>
          <option value="group">Eng Group</option>
        </select>
        <select id="lookupValue" style="flex:1;"></select>
        <button class="btn-square" onclick="lookupScores()">Search</button>
      </div>
      <div id="lookupResults" style="max-height:340px; overflow-y:auto; border:2px solid black; padding:6px; margin-top:6px; display:none; background:#ffffff;"></div>
    </div>
  </div>
</div>

<!-- UNIFIED MODAL -->
<div id="unifiedModal" class="modal-overlay">
  <div class="modal-card">
    <div id="modalTitle" class="modal-title"></div>
    <div id="modalBody"></div>
    <div id="modalActions" class="modal-actions"></div>
  </div>
</div>

<script>
  const GAS_API_URL = "https://script.google.com/macros/s/AKfycbw8aryp3-LxbJmqSjqRod2yPHyZBCkL1UKfsq_I2ctJcnOXlOYjpYK8IzJAcpd645mi/exec";
  const houseNames = { 'Red': 'Red 仁', 'Purple': 'Purple 愛', 'Yellow': 'Yellow 勤', 'Green': 'Green 誠' };
  let html5QrcodeScanner = null;
  let idToken = localStorage.getItem('google_id_token') || '';
  let pendingStudentData = null;

  // --- High-Performance Synthesized Web Audio API Engine ---
  let audioCtx = null;

  function initAudioContext() {
    if (!audioCtx) {
      const AudioContext = window.AudioContext || window.webkitAudioContext;
      if (AudioContext) audioCtx = new AudioContext();
    }
    if (audioCtx && audioCtx.state === 'suspended') {
      audioCtx.resume();
    }
  }

  document.addEventListener('click', initAudioContext, { once: true });
  document.addEventListener('touchstart', initAudioContext, { once: true });

  function playSoundEffect(type) {
    initAudioContext();
    if (!audioCtx) return;
    const now = audioCtx.currentTime;

    if (type === 'scan') {
      // Robust Dual-Tone Synth Pop (Scan & Manual Detection)
      const osc1 = audioCtx.createOscillator();
      const osc2 = audioCtx.createOscillator();
      const gain = audioCtx.createGain();

      osc1.type = 'sine'; osc2.type = 'triangle';
      osc1.frequency.setValueAtTime(880, now);      // A5
      osc1.frequency.setValueAtTime(1108.73, now + 0.06); // C#6
      osc2.frequency.setValueAtTime(440, now);

      gain.gain.setValueAtTime(0.35, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.22);

      osc1.connect(gain); osc2.connect(gain);
      gain.connect(audioCtx.destination);

      osc1.start(now); osc1.stop(now + 0.22);
      osc2.start(now); osc2.stop(now + 0.22);

    } else if (type === 'success') {
      // Triumphant Ascending Major Triad Chord (Point Award Confirmed)
      const frequencies = [523.25, 659.25, 783.99, 1046.50]; // C5 -> E5 -> G5 -> C6
      frequencies.forEach((freq, idx) => {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();

        osc.type = 'sine';
        osc.frequency.setValueAtTime(freq, now + idx * 0.07);

        gain.gain.setValueAtTime(0.0, now);
        gain.gain.setValueAtTime(0.3, now + idx * 0.07);
        gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.07 + 0.45);

        osc.connect(gain);
        gain.connect(audioCtx.destination);

        osc.start(now + idx * 0.07);
        osc.stop(now + idx * 0.07 + 0.45);
      });

    } else if (type === 'error') {
      // Heavy Sawtooth Low Warning Buzz (Error & Cooldown)
      const osc1 = audioCtx.createOscillator();
      const osc2 = audioCtx.createOscillator();
      const gain = audioCtx.createGain();

      osc1.type = 'sawtooth'; osc2.type = 'square';
      osc1.frequency.setValueAtTime(150, now);
      osc1.frequency.setValueAtTime(110, now + 0.12);
      osc2.frequency.setValueAtTime(155, now);

      gain.gain.setValueAtTime(0.4, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.4);

      osc1.connect(gain); osc2.connect(gain);
      gain.connect(audioCtx.destination);

      osc1.start(now); osc1.stop(now + 0.4);
      osc2.start(now); osc2.stop(now + 0.4);
    }
  }

  function renderModal(title, titleStyle, bodyHtml, actionsHtml) {
    document.getElementById('modalTitle').className = `modal-title ${titleStyle}`;
    document.getElementById('modalTitle').innerText = title;
    document.getElementById('modalBody').innerHTML = bodyHtml;
    document.getElementById('modalActions').innerHTML = actionsHtml;
    document.getElementById('unifiedModal').style.display = 'flex';
  }

  function closeModal() {
    document.getElementById('unifiedModal').style.display = 'none';
    pendingStudentData = null;
  }

  // Unified State & Authentication Manager
  function updateAuthUI(isLoggedIn, userEmail = '') {
    const logoutBtn = document.getElementById('logoutBtn');
    const userBadge = document.getElementById('userBadge');
    const teacherPanel = document.getElementById('teacherPanel');
    const authWrapper = document.getElementById('authWrapper');

    const emailToDisplay = userEmail || localStorage.getItem('cached_user_email') || '';

    if (isLoggedIn) {
      if (authWrapper) authWrapper.style.display = 'none'; // Hide Google login button
      if (logoutBtn) logoutBtn.style.display = 'inline-block';
      userBadge.innerText = emailToDisplay ? `Teacher: ${emailToDisplay}` : 'Teacher Terminal';
      if (teacherPanel) teacherPanel.style.display = 'flex';
    } else {
      if (authWrapper) authWrapper.style.display = 'inline-block'; // Show Google login button
      if (logoutBtn) logoutBtn.style.display = 'none';
      userBadge.innerText = 'Public Mode';
      if (teacherPanel) teacherPanel.style.display = 'none';
    }
  }

  function proceedAsGuest() {
    document.getElementById('landingOverlay').style.display = 'none';
    document.getElementById('mainContainer').style.visibility = 'visible';
  }

  function handleCredentialResponse(response) {
    document.getElementById('landingStatus').innerText = "Authenticating Teacher...";
    document.getElementById('landingLoader').style.display = 'block';
    if (document.getElementById('authWrapper')) document.getElementById('authWrapper').style.display = 'none';
    
    idToken = response.credential;
    localStorage.setItem('google_id_token', idToken);
    loadInitialData();
  }

  function logout() {
    idToken = '';
    localStorage.clear();
    updateAuthUI(false);
    location.reload();
  }

  async function loadInitialData() {
    const cachedLb = localStorage.getItem('cached_leaderboard');
    if (cachedLb) renderLeaderboards(JSON.parse(cachedLb));
    
    try {
      const qs = new URLSearchParams({ action: 'init', idToken: idToken }).toString();
      const res = await (await fetch(`${GAS_API_URL}?${qs}`)).json();

      if (res.isTeacher) {
        localStorage.setItem('cached_user_email', res.userEmail || '');
        localStorage.setItem('cached_is_teacher', 'true');
        updateAuthUI(true, res.userEmail);

        localStorage.setItem('cached_students_db', JSON.stringify(res.studentsMap || {}));
        window.dropdownOpts = { classes: res.classes || [], groups: res.groups || [] };
        updateLookupDropdown();

        // Dismiss landing screen cleanly
        document.getElementById('landingOverlay').style.display = 'none';
        document.getElementById('mainContainer').style.visibility = 'visible';
      } else {
        localStorage.removeItem('cached_user_email');
        localStorage.removeItem('cached_is_teacher');
        updateAuthUI(false);

        if (idToken) {
          document.getElementById('landingStatus').innerText = "Account not in Teachers sheet!";
          document.getElementById('landingLoader').style.display = 'none';
          if (document.getElementById('authWrapper')) document.getElementById('authWrapper').style.display = 'inline-block';
        }
      }

      if (res.leaderboard) {
        localStorage.setItem('cached_leaderboard', JSON.stringify(res.leaderboard));
        renderLeaderboards(res.leaderboard);
      }
    } catch (e) {
      console.error("Init Error:", e);
    }
  }

  window.onload = () => {
    // Synchronous immediate check on page load
    const cachedIsTeacher = localStorage.getItem('cached_is_teacher') === 'true';
    if (idToken && cachedIsTeacher) {
      document.getElementById('landingStatus').innerText = "RESTORING TEACHER SESSION...";
      document.getElementById('landingLoader').style.display = 'block';
      if (document.getElementById('authWrapper')) document.getElementById('authWrapper').style.display = 'none';
      updateAuthUI(true, localStorage.getItem('cached_user_email') || '');
    } else {
      updateAuthUI(false);
    }

    loadInitialData();
    setInterval(() => refreshLeaderboard(true), 15000);
    document.getElementById('lookupType').addEventListener('change', updateLookupDropdown);
  };

  async function toggleScanner() {
    const btn = document.getElementById('scanBtn');
    const wrapper = document.getElementById('scannerWrapper');

    if (html5QrcodeScanner) {
      await stopScanner();
    } else {
      btn.innerText = "INITIALIZING...";
      btn.disabled = true;
      wrapper.classList.add('active');

      try {
        html5QrcodeScanner = new Html5Qrcode("reader");
        await html5QrcodeScanner.start(
          { facingMode: "environment" }, 
          { fps: 10, qrbox: { width: 220, height: 90 }, aspectRatio: 1.777778 },
          (decodedText) => onCodeScanned(decodedText),
          (err) => {}
        );
        btn.innerText = "STOP SCANNER";
      } catch (err) {
        console.error("Camera Start Error:", err);
        playSoundEffect('error');
        renderModal("Camera Error", "error", `<div style="font-weight:700; text-align:center;">Could not access camera. Check permissions.</div>`, `<button class="btn-cancel" onclick="closeModal()">CLOSE</button>`);
        await stopScanner();
      } finally {
        btn.disabled = false;
      }
    }
  }

  async function stopScanner() {
    const btn = document.getElementById('scanBtn');
    const wrapper = document.getElementById('scannerWrapper');
    btn.disabled = true;

    if (html5QrcodeScanner) {
      try {
        if (html5QrcodeScanner.isScanning) {
          await html5QrcodeScanner.stop();
        }
        await html5QrcodeScanner.clear();
      } catch (e) {
        console.warn("Scanner stop exception:", e);
      } finally {
        html5QrcodeScanner = null;
      }
    }

    document.getElementById('reader').innerHTML = '';
    wrapper.classList.remove('active');
    btn.innerText = "START SCANNER";
    btn.disabled = false;
  }

  function submitManual() {
    const val = document.getElementById('manualId').value.trim();
    if (val) { 
      onCodeScanned(val); 
      document.getElementById('manualId').value = ""; 
      document.getElementById('manualId').blur(); 
    }
  }

  async function onCodeScanned(scannedId) {
    if (pendingStudentData) return;
    await stopScanner();

    const cleanId = String(scannedId).trim();
    const studentsMap = JSON.parse(localStorage.getItem('cached_students_db') || '{}');
    const student = studentsMap[cleanId] || studentsMap[cleanId.replace(/^0+/, '')];

    if (!student) {
      playSoundEffect('error');
      renderModal("Not Found", "error", `<div style="font-weight:700; text-align:center;">Student ID not found:<br>"${cleanId}"</div>`, `<button class="btn-cancel" onclick="closeModal()">CLOSE</button>`);
      return;
    }

    let recentScans = JSON.parse(localStorage.getItem('recent_scans') || '{}');
    let now = Date.now();
    let lastScanTime = recentScans[student.id] || 0;

    if (now - lastScanTime < 60000) {
      let remainingSec = Math.ceil((lastScanTime + 60000 - now) / 1000);
      playSoundEffect('error');
      renderModal("Cooldown Active", "error", 
        `<div style="font-weight:700; text-align:center;">⚠️ ${student.name} (${student.className}) scored recently.<br>Wait ${remainingSec}s.</div>`,
        `<button class="btn-cancel" onclick="closeModal()">CLOSE</button>`
      );
    } else {
      pendingStudentData = student;
      playSoundEffect('scan');
      renderModal("Confirm Award Point", "",
        `<div class="modal-info-row"><span>Name:</span><span>${student.name}</span></div>
         <div class="modal-info-row"><span>Class:</span><span>${student.className} (${student.classNo})</span></div>
         <div class="modal-info-row"><span>Group:</span><span>${student.englishGroup}</span></div>
         <div class="modal-info-row"><span>House:</span><span>${houseNames[student.house] || student.house}</span></div>
         <div class="modal-info-row"><span>Current Score:</span><span>${student.totalScore || 0} pt</span></div>`,
        `<button class="btn-confirm" onclick="confirmPointAward()">CONFIRM (+1)</button>
         <button class="btn-cancel" onclick="closeModal()">CANCEL</button>`
      );
    }
  }

  async function confirmPointAward() {
    if (!pendingStudentData) return;
    const student = pendingStudentData;
    
    document.getElementById('modalActions').innerHTML = `<div style="text-align:center; width:100%; font-weight:bold;">Processing...</div>`;

    try {
      const res = await (await fetch(GAS_API_URL, {
        method: 'POST', redirect: 'follow', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ action: 'recordPoint', idToken: idToken, studentId: student.id })
      })).json();

      if (res.success) {
        playSoundEffect('success');
        
        let recentScans = JSON.parse(localStorage.getItem('recent_scans') || '{}');
        recentScans[student.id] = Date.now();
        localStorage.setItem('recent_scans', JSON.stringify(recentScans));

        const studentsMap = JSON.parse(localStorage.getItem('cached_students_db') || '{}');
        if (studentsMap[student.id]) {
          studentsMap[student.id].totalScore = (studentsMap[student.id].totalScore || 0) + 1;
          localStorage.setItem('cached_students_db', JSON.stringify(studentsMap));
        }

        closeModal();
        refreshLeaderboard(true);
      } else if (res.cooldown) {
        playSoundEffect('error');
        renderModal("Cooldown Active", "error", 
          `<div style="font-weight:700; text-align:center;">⚠️ ${res.message}</div>`,
          `<button class="btn-cancel" onclick="closeModal()">CLOSE</button>`
        );
      } else {
        playSoundEffect('error');
        renderModal("Error", "error", `<div style="font-weight:700; text-align:center;">${res.message}</div>`, `<button class="btn-cancel" onclick="closeModal()">CLOSE</button>`);
      }
    } catch (err) {
      playSoundEffect('error');
      renderModal("Network Error", "error", `<div style="font-weight:700; text-align:center;">Failed to connect to server.</div>`, `<button class="btn-cancel" onclick="closeModal()">CLOSE</button>`);
    }
  }

  function applyPreset() {
    const val = document.getElementById('presetRange').value;
    const now = new Date();
    if (val === 'today') {
      const today = now.toISOString().split('T')[0];
      document.getElementById('startDate').value = today;
      document.getElementById('endDate').value = today;
    } else if (val === 'thisWeek') {
      const day = now.getDay() || 7;
      const monday = new Date(now); monday.setDate(now.getDate() - day + 1);
      const sunday = new Date(now); sunday.setDate(now.getDate() - day + 7);
      document.getElementById('startDate').value = monday.toISOString().split('T')[0];
      document.getElementById('endDate').value = sunday.toISOString().split('T')[0];
    } else {
      document.getElementById('startDate').value = ""; document.getElementById('endDate').value = "";
    }
    refreshLeaderboard(false);
  }

  async function refreshLeaderboard(isSilent = false) {
    const start = document.getElementById('startDate').value;
    const end = document.getElementById('endDate').value;
    try {
      const qs = new URLSearchParams({ action: 'leaderboard', startDate: start, endDate: end }).toString();
      const data = await (await fetch(`${GAS_API_URL}?${qs}`)).json();
      if (data && data.students) {
        localStorage.setItem('cached_leaderboard', JSON.stringify(data));
        renderLeaderboards(data);
      }
    } catch (e) { if (!isSilent) console.error(e); }
  }

  function renderLeaderboards(data) {
    if (!data) return;
    document.getElementById('grandTotal').innerText = data.totalInteractions || 0;
    const icons = ['🥇', '🥈', '🥉'];

    document.getElementById('studentList').innerHTML = (data.students || []).map(s => {
      const r = s.rank; const iconStr = r <= 3 ? icons[r - 1] : `#${r}`;
      const podiumClass = r === 1 ? 'podium-1' : (r === 2 ? 'podium-2' : (r === 3 ? 'podium-3' : ''));
      return `<div class="stat-row ${podiumClass}"><span>${iconStr} ${s.name} (${s.className})</span><span>${s.score} pt</span></div>`;
    }).join('') || '<div style="padding:8px 0; font-size:0.85rem;">No speaking logs found.</div>';

    const maxHouse = Math.max(...(data.houses || []).map(h => h.score), 1);
    document.getElementById('houseList').innerHTML = (data.houses || []).map(h => `
      <div style="margin-bottom:8px;">
        <div style="display:flex; justify-content:space-between; font-weight:700; font-size:0.85rem;"><span>#${h.rank} ${houseNames[h.name] || h.name}</span><span>${h.score} pt</span></div>
        <div class="house-bar-container"><div class="house-bar bg-${h.name}" style="width:${(h.score/maxHouse)*100}%;"></div></div>
      </div>`).join('');

    document.getElementById('groupList').innerHTML = (data.groups || []).map(g => `<div class="stat-row"><span>#${g.rank} ${g.name}</span><span>${g.score}</span></div>`).join('') || '<div style="padding:6px 0; font-size:0.85rem;">-</div>';
    document.getElementById('classList').innerHTML = (data.classes || []).map(c => `<div class="stat-row"><span>#${c.rank} ${c.name}</span><span>${c.score}</span></div>`).join('') || '<div style="padding:6px 0; font-size:0.85rem;">-</div>';
  }

  function updateLookupDropdown() {
    if (!window.dropdownOpts) return;
    const arr = document.getElementById('lookupType').value === 'class' ? window.dropdownOpts.classes : window.dropdownOpts.groups;
    document.getElementById('lookupValue').innerHTML = (arr || []).map(a => `<option value="${a}">${a}</option>`).join('');
  }

  async function lookupScores() {
    const type = document.getElementById('lookupType').value;
    const val = document.getElementById('lookupValue').value;
    const start = document.getElementById('startDate').value;
    const end = document.getElementById('endDate').value;
    
    if (!val) return;

    document.getElementById('lookupResults').innerHTML = 'Loading...';
    document.getElementById('lookupResults').style.display = 'block';

    try {
      const qs = new URLSearchParams({ 
        action: 'lookup', 
        filterType: type, 
        filterValue: val, 
        startDate: start, 
        endDate: end,
        idToken: idToken
      }).toString();
      
      const res = await (await fetch(`${GAS_API_URL}?${qs}`)).json();
      
      if (!res.success) {
        document.getElementById('lookupResults').innerHTML = res.message || 'Lookup failed.';
        return;
      }

      if (!res.students || res.students.length === 0) {
        document.getElementById('lookupResults').innerHTML = 'No students found.';
      } else {
        document.getElementById('lookupResults').innerHTML = res.students.map(r => `
          <div style="display:flex; justify-content:space-between; border-bottom:1px solid #000; padding:3px 0; font-size:0.85rem;">
            <span>${r.classNo ? r.classNo + '. ' : ''}${r.name}</span>
            <strong>${r.score} pt</strong>
          </div>
        `).join('');
      }
    } catch(e) { 
      document.getElementById('lookupResults').innerHTML = 'Search failed.'; 
    }
  }
</script>
